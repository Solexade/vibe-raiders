<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Boy_yuskid's Orange Dynasty Space Calendar</title>
    <style>
        body {
            background-color: orange;
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        h1 {
            text-align: center;
            color: white;
            font-size: 2em;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            background-color: white;
            overflow-x: scroll;
        }
        th, td {
            border: 2px solid orange;
            padding: 10px;
            text-align: center;
            font-size: 0.85em;
        }
        th {
            background-color: darkorange;
            color: white;
            position: sticky;
            top: 0;
        }
        td {
            background-color: #fff8e1;
        }
        td[contenteditable="true"] {
            background-color: #fff3e0;
        }
        .save-button {
            display: block;
            margin: 20px auto;
            padding: 10px 20px;
            font-size: 1em;
            background-color: darkorange;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 10px;
        }
        .save-button:hover {
            background-color: orangered;
        }
        .table-container {
            overflow-x: auto;
        }
    </style>
</head>
<body>

<h1>Boy_yuskid's Orange Dynasty Space Calendar</h1>

<div class="table-container">
<table id="calendarTable">
    <thead>
        <tr>
            <th>Day</th>
            <!-- Repeat Space/Time/Host columns -->
            ${[...Array(6)].map((_, i) => `
                <th>Space ${i + 1}</th>
                <th>Time ${i + 1}</th>
                <th>Host ${i + 1}</th>
            `).join('')}
        </tr>
    </thead>
    <tbody>
        ${['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'].map(day => `
            <tr>
                <td>${day}</td>
                ${[...Array(6)].map(() => `
                    <td contenteditable="true"></td>
                    <td contenteditable="true"></td>
                    <td contenteditable="true"></td>
                `).join('')}
            </tr>
        `).join('')}
    </tbody>
</table>
</div>

<button class="save-button" onclick="saveCalendar()">Save Calendar</button>

<script>
function saveCalendar() {
    let table = document.getElementById("calendarTable");
    let text = "";

    for (let i = 0; i < table.rows.length; i++) {
        let cells = table.rows[i].cells;
        for (let j = 0; j < cells.length; j++) {
            text += cells[j].innerText.trim() + (j < cells.length - 1 ? " | " : "");
        }
        text += "\n";
    }

    let blob = new Blob([text], { type: "text/plain;charset=utf-8" });
    let link = document.createElement("a");
    link.href = URL.createObjectURL(blob);
    link.download = "Boy_Yuskid_Orange_Dynasty_Calendar.txt";
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
}
</script>

</body>
</html>
